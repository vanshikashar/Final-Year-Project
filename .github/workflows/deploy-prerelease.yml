name: Deploy Semantic Pre-Release

on:
  push:
    tags:
      - 'v*-develop.*'

permissions:
  contents: read

jobs:
  validate-prerelease:
    name: Validate Pre-Release Tag
    runs-on: ubuntu-latest

    steps:
      - name: Checkout tagged commit
        uses: actions/checkout@v6
        with:
          ref: ${{ github.ref }}
          fetch-depth: 0

      - name: Verify pre-release version
        shell: bash
        run: |
          set -euo pipefail

          TAG="${GITHUB_REF_NAME}"

          if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+-develop\.[0-9]+$ ]]; then
            echo "Invalid development pre-release tag: $TAG"
            exit 1
          fi

          echo "Validated pre-release: $TAG"

      - name: Verify tagged commit belongs to develop
        shell: bash
        run: |
          set -euo pipefail

          git fetch origin develop

          if ! git merge-base --is-ancestor \
            "$GITHUB_SHA" origin/develop; then
            echo "Tagged commit is not in develop history."
            exit 1
          fi

          echo "Tagged commit is part of develop history."

      - name: Deployment placeholder
        run: |
          echo "Pre-release validated."
          echo "Add the approved staging deployment commands here."