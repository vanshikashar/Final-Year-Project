services:
  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: /api
    ports:
      - "8080:80"
    depends_on:
      - backend

  backend:
    build: ./backend
    environment:
      PORT: "5000"
      FRONTEND_URL: "http://localhost:8080"
      MONGODB_URI: ${MONGODB_URI}
      ML_SERVICE_URL: http://ml-service:8000
    depends_on:
      - ml-service

  ml-service:
    build: ./ml-service
    expose:
      - "8000"